name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, or attach the scenario JSON and the seed (the same input always gives the same result).
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app
        - CLI
        - Engine
        - Importers (traces)
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A commit hash, or "live site" for https://salamancacm.github.io/fragor/
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node version, browser
