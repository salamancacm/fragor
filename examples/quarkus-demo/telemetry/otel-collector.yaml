# Receives the services' traces over OTLP/gRPC (the Quarkus default, port 4317) and writes them as
# newline-delimited OTLP JSON, which `fragor import traces` reads.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  file:
    path: /out/traces.jsonl
    format: json

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
