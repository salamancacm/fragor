# API Gateway (Fragor node "gateway": 200 workers, queue 1000)
quarkus.http.port=8080
quarkus.thread-pool.max-threads=200
quarkus.thread-pool.queue-size=1000

quarkus.rest-client.order.url=http://localhost:8081

# Connection pool: the Quarkus default is 50 connections per client, which acts as a hidden
# bulkhead that the Fragor mirror scenario does not have. Raised so threads are the only limit.
# Run with CONNECTION_POOL_SIZE=50 (the Quarkus default) to see its effect.
quarkus.rest-client.order.connection-pool-size=${CONNECTION_POOL_SIZE:1000}
