# Order Service (Fragor node "order": 100 workers, queue 200)
quarkus.http.port=8081
quarkus.thread-pool.max-threads=100
quarkus.thread-pool.queue-size=200

quarkus.rest-client.payment.url=http://localhost:8082

# Scenario 01 (default): timeout + retry only. The breaker and the fallback are switched off.
smallrye.faulttolerance."fragor.demo.order.PaymentGateway/charge".circuit-breaker.enabled=false
smallrye.faulttolerance."fragor.demo.order.PaymentGateway/charge".fallback.enabled=false

# Scenario 02 (QUARKUS_PROFILE=breaker): circuit breaker + degraded fallback.
%breaker.smallrye.faulttolerance."fragor.demo.order.PaymentGateway/charge".circuit-breaker.enabled=true
%breaker.smallrye.faulttolerance."fragor.demo.order.PaymentGateway/charge".fallback.enabled=true

# Connection pool: the Quarkus default is 50 connections per client, which acts as a hidden
# bulkhead that the Fragor mirror scenario does not have. Raised so threads are the only limit.
# Run with CONNECTION_POOL_SIZE=50 (the Quarkus default) to see its effect.
quarkus.rest-client.payment.connection-pool-size=${CONNECTION_POOL_SIZE:1000}
