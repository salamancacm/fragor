# Payment Service (Fragor node "payment": 50 workers, queue 100)
quarkus.http.port=8082
quarkus.thread-pool.max-threads=50
quarkus.thread-pool.queue-size=100

# Edge payment-external: only the REST client read timeout (30 s, the Quarkus default, made explicit)
quarkus.rest-client.external.url=http://localhost:8083
quarkus.rest-client.external.read-timeout=30000

# Connection pool: the Quarkus default is 50 connections per client, which acts as a hidden
# bulkhead that the Fragor mirror scenario does not have. Raised so threads are the only limit.
# Run with CONNECTION_POOL_SIZE=50 (the Quarkus default) to see its effect.
quarkus.rest-client.external.connection-pool-size=${CONNECTION_POOL_SIZE:1000}
